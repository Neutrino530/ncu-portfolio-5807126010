<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>双摆混沌模拟器 · RK4 · Week 05</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #1a1a24;
    color: #c9d4e2;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-text-size-adjust: 100%;
  }

  header {
    flex: 0 0 auto;
    padding: 10px 18px;
    border-bottom: 1px solid rgba(0, 229, 255, .12);
    display: flex;
    align-items: baseline;
    gap: 14px;
    flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: .5px; color: #e8f4ff; }
  header h1 span { color: #00e5ff; }
  header .meta { font-size: 12px; color: #6b7a8d; }

  #stage { position: relative; flex: 1 1 auto; min-height: 0; }
  canvas {
    display: block; width: 100%; height: 100%;
    cursor: grab;
    touch-action: none;                 /* 触屏拖拽时禁止页面跟随滚动 */
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas.dragging { cursor: grabbing; }

  #panel {
    flex: 0 0 auto;
    background: #171720;
    border-top: 1px solid rgba(0, 229, 255, .12);
    padding: 10px 14px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px 20px;
  }
  .ctrl { display: flex; flex-direction: column; gap: 4px; min-width: 150px; }
  .ctrl label { font-size: 12px; color: #8fa3b8; display: flex; justify-content: space-between; gap: 12px; }
  .ctrl label b { color: #00e5ff; font-weight: 600; font-variant-numeric: tabular-nums; }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 4px; border-radius: 2px; outline: none;
    background: linear-gradient(90deg, rgba(0,229,255,.25), rgba(0,229,255,.7));
    touch-action: manipulation;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: #00e5ff; box-shadow: 0 0 8px rgba(0,229,255,.7); cursor: pointer;
  }
  input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px; border: 0; border-radius: 50%;
    background: #00e5ff; box-shadow: 0 0 8px rgba(0,229,255,.7); cursor: pointer;
  }

  .btns { display: flex; gap: 8px; align-items: center; }
  button {
    background: #22222e; color: #c9d4e2; cursor: pointer;
    border: 1px solid rgba(0, 229, 255, .25); border-radius: 6px;
    padding: 6px 14px; font-size: 13px; font-family: inherit;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  button:hover { background: #2a2a3a; border-color: rgba(0,229,255,.55); }
  button.primary { background: #00e5ff; border-color: #00e5ff; color: #001018; font-weight: 600; }
  button.warn { border-color: rgba(255, 170, 60, .45); color: #ffc98a; }
  .hint { font-size: 11px; color: #5c6a7d; margin-left: auto; }
  .chk { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #8fa3b8; cursor: pointer; }

  /* ---------- 天体预设胶囊按钮 ---------- */
  .caps { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .cap {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 15px; border-radius: 999px; font-size: 13px;
    background: #1c1c26; color: #8fa3b8;
    border: 1px solid rgba(255, 255, 255, .10); cursor: pointer;
    font-family: inherit;
    transition: background .28s ease, color .28s ease, border-color .28s ease, box-shadow .28s ease;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .cap i {
    width: 8px; height: 8px; border-radius: 50%; display: block;
    box-shadow: 0 0 6px currentColor; flex: 0 0 auto;
  }
  .cap[data-k="earth"] i { background: #3b82f6; }
  .cap[data-k="moon"]  i { background: #cbd5e1; }
  .cap[data-k="mars"]  i { background: #e2703a; }
  .cap[data-k="space"] i { background: #8b5cf6; }
  .cap:hover { color: #cfe6ff; border-color: rgba(0, 229, 255, .40); }
  .cap.active {
    color: #eafcff; border-color: rgba(0, 229, 255, .75);
    background: rgba(0, 229, 255, .10);
    box-shadow: inset 0 0 12px rgba(0, 229, 255, .18);
  }

  /* ---------- 响应式 / 移动端 ---------- */
  @media (max-width: 720px) {
    header { padding: 8px 12px; gap: 4px; }
    header h1 { font-size: 14px; }
    header .meta { font-size: 11px; }
    #panel { padding: 8px 10px; gap: 10px 12px; }
    .ctrl { min-width: 130px; flex: 1 1 130px; }
    .caps { flex: 1 1 100%; gap: 6px; }
    .cap { flex: 1 1 auto; justify-content: center; padding: 10px 8px; }
    .btns { flex: 1 1 100%; }
    .btns button { flex: 1 1 auto; padding: 11px 6px; }
    .hint { display: none; }
  }
  @media (max-width: 380px) {
    .ctrl { min-width: 100%; }
  }
</style>
</head>
<body>

<header>
  <h1>双摆<span>混沌</span>模拟器</h1>
  <div class="meta">南昌大学 · 环境工程 · 黄子晴 / 5807126010 · Week 05 · Runge-Kutta 4 阶积分 · 拉格朗日二阶微分方程</div>
</header>

<div id="stage"><canvas id="sim"></canvas></div>

<div id="panel">
  <div class="caps" id="caps">
    <button class="cap active" type="button" data-k="earth" data-g="9.8"><i></i>地球</button>
    <button class="cap" type="button" data-k="moon"  data-g="1.62"><i></i>月球</button>
    <button class="cap" type="button" data-k="mars"  data-g="3.71"><i></i>火星</button>
    <button class="cap" type="button" data-k="space" data-g="0"><i></i>太空</button>
  </div>

  <div class="ctrl">
    <label>上摆长 L₁ <b><span id="vL1">130</span> px</b></label>
    <input id="sL1" type="range" min="60" max="180" step="1" value="130" />
  </div>
  <div class="ctrl">
    <label>下摆长 L₂ <b><span id="vL2">110</span> px</b></label>
    <input id="sL2" type="range" min="60" max="180" step="1" value="110" />
  </div>
  <div class="ctrl">
    <label>重力 g <b><span id="vG">9.8</span> m/s²</b></label>
    <input id="sG" type="range" min="0" max="25" step="0.1" value="9.8" />
  </div>
  <div class="btns">
    <button id="btnRun" class="primary">暂停</button>
    <button id="btnReset">重置摆动</button>
    <button id="btnKick" class="warn">施加微扰</button>
    <button id="btnClear">清除轨迹</button>
    <label class="chk"><input id="chkTrail" type="checkbox" checked />轨迹</label>
  </div>
  <div class="hint">拖拽任一摆球改变角度 · 空格暂停 · R 重置 · P 微扰 · 参数自动本地保存</div>
</div>

<script>
(function () {
  'use strict';

  var cv = document.getElementById('sim');
  var ctx = cv.getContext('2d');
  var stage = document.getElementById('stage');

  var PX_PER_M = 100;
  var DEG = Math.PI / 180;

  var P = {
    L1: 130, L2: 110,
    g: 9.8, m1: 1, m2: 1,
    running: true, showTrail: true
  };

  // 天体预设：重力加速度 m/s²（太空取 0，失重自由漂移）
  var PRESETS = {
    earth: { name: '地球', g: 9.8 },
    moon:  { name: '月球', g: 1.62 },
    mars:  { name: '火星', g: 3.71 },
    space: { name: '太空', g: 0 }
  };
  var activePreset = 'earth';
  var gAnim = null;                       // 重力过渡动画状态

  var y = [120 * DEG, 0, 0, 0];
  var simTime = 0;
  var E0 = 0;

  var trail1 = [], trail2 = [];
  var MAX1 = 260, MAX2 = 420;

  var W = 0, H = 0, cx = 0, cy = 0;
  var R1 = 14, R2 = 16;
  var lastW = -1, lastH = -1, lastSpan = -1;
  var ro = null;                          // ResizeObserver 引用需持有，避免被回收

  // ---------- 画布尺寸（响应式 + 高分屏 + 旋转屏幕） ----------
  function resize(force) {
    var rect = stage.getBoundingClientRect();
    var span = P.L1 + P.L2;
    if (!force && Math.abs(rect.width - lastW) < 0.5
        && Math.abs(rect.height - lastH) < 0.5 && span === lastSpan) return;
    lastW = rect.width; lastH = rect.height; lastSpan = span;

    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = rect.width; H = rect.height;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W / 2;
    // 悬点高度同时兼顾"翻转越顶"与"垂吊到底"两种极值位置
    var minCy = 34 + span, maxCy = H - 26 - span;
    cy = (minCy > maxCy) ? (minCy + maxCy) / 2 : Math.max(minCy, Math.min(H * 0.30, maxCy));
  }
  window.addEventListener('resize', function () { resize(); });
  window.addEventListener('orientationchange', function () { setTimeout(function () { resize(true); }, 220); });
  if (window.ResizeObserver) { ro = new ResizeObserver(function () { resize(); }); ro.observe(stage); }

  // ============================================================
  //  物理：双摆拉格朗日方程（无质量刚性杆 + 端点集中质量）
  //  分母 2m1+m2-m2·cos(2(θ1-θ2)) ∈ [2m1+m2, 2m1+2m2]，恒 > 0，无奇点
  // ============================================================
  function deriv(s) {
    var th1 = s[0], w1 = s[1], th2 = s[2], w2 = s[3];
    var m1 = P.m1, m2 = P.m2;
    var L1 = P.L1 / PX_PER_M, L2 = P.L2 / PX_PER_M;
    var d = th1 - th2;
    var sd = Math.sin(d), cd = Math.cos(d);
    var den = 2 * m1 + m2 - m2 * Math.cos(2 * d);

    var a1 = (-P.g * (2 * m1 + m2) * Math.sin(th1)
              - m2 * P.g * Math.sin(th1 - 2 * th2)
              - 2 * sd * m2 * (w2 * w2 * L2 + w1 * w1 * L1 * cd)) / (L1 * den);

    var a2 = (2 * sd * (w1 * w1 * L1 * (m1 + m2)
              + P.g * (m1 + m2) * Math.cos(th1)
              + w2 * w2 * L2 * m2 * cd)) / (L2 * den);

    return [w1, a1, w2, a2];
  }

  function shift(s, k, f) {
    return [s[0] + f * k[0], s[1] + f * k[1], s[2] + f * k[2], s[3] + f * k[3]];
  }

  var H_STEP = 1 / 600;
  function rk4(h) {
    var k1 = deriv(y);
    var k2 = deriv(shift(y, k1, h / 2));
    var k3 = deriv(shift(y, k2, h / 2));
    var k4 = deriv(shift(y, k3, h));
    for (var i = 0; i < 4; i++) {
      y[i] += (h / 6) * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i]);
    }
  }

  function energy() {
    var m1 = P.m1, m2 = P.m2;
    var L1 = P.L1 / PX_PER_M, L2 = P.L2 / PX_PER_M;
    var th1 = y[0], th2 = y[2], w1 = y[1], w2 = y[3];
    var T = 0.5 * m1 * L1 * L1 * w1 * w1
          + 0.5 * m2 * (L1 * L1 * w1 * w1 + L2 * L2 * w2 * w2
             + 2 * L1 * L2 * w1 * w2 * Math.cos(th1 - th2));
    var V = -(m1 + m2) * P.g * L1 * Math.cos(th1) - m2 * P.g * L2 * Math.cos(th2);
    return T + V;
  }

  function pos1() { return { x: cx + P.L1 * Math.sin(y[0]), y: cy + P.L1 * Math.cos(y[0]) }; }
  function pos2() {
    var a = pos1();
    return { x: a.x + P.L2 * Math.sin(y[2]), y: a.y + P.L2 * Math.cos(y[2]) };
  }

  function reset() {
    y = [120 * DEG, 0, 0, 0];
    simTime = 0;
    trail1.length = 0; trail2.length = 0;
    E0 = energy();
  }

  // ============================================================
  //  天体预设：重力平滑过渡 + 滑块同步
  // ============================================================
  var f0 = function (x) { return x.toFixed(0); };
  var f1 = function (x) { return x.toFixed(1); };

  function syncSlider(id, valId, v, fmt) {
    document.getElementById(id).value = v;
    document.getElementById(valId).textContent = fmt(v);
  }

  function markCap(k) {
    var caps = document.querySelectorAll('#caps .cap');
    for (var i = 0; i < caps.length; i++) {
      caps[i].classList.toggle('active', caps[i].getAttribute('data-k') === k);
    }
  }

  function matchPreset(g) {
    for (var k in PRESETS) {
      if (Object.prototype.hasOwnProperty.call(PRESETS, k) && Math.abs(PRESETS[k].g - g) < 0.06) return k;
    }
    return null;
  }

  function animateG(target) {
    if (target === P.g) { gAnim = null; return; }
    gAnim = { from: P.g, to: target, t0: performance.now(), dur: 760 };
  }

  // 每帧推进过渡曲线：easeInOutCubic，起止速度为 0 → 无突变
  function updateGAnim(now) {
    if (!gAnim) return;
    var k = Math.min(1, (now - gAnim.t0) / gAnim.dur);
    var e = (k < 0.5) ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    P.g = gAnim.from + (gAnim.to - gAnim.from) * e;
    syncSlider('sG', 'vG', Math.round(P.g * 10) / 10, f1);
    if (k >= 1) { P.g = gAnim.to; gAnim = null; E0 = energy(); }
  }

  // ============================================================
  //  localStorage 持久化：自动保存 / 自动恢复
  // ============================================================
  var LS_KEY = 'ncu_week05_pendulum_v1';
  var saveTimer = 0;

  function saveConfig() {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try {
        localStorage.setItem(LS_KEY, JSON.stringify({
          v: 1, L1: P.L1, L2: P.L2, g: P.g, preset: activePreset
        }));
      } catch (err) { /* 隐私模式 / 存储被禁用 → 静默降级为不持久化 */ }
    }, 250);
  }

  function loadConfig() {
    var raw = null;
    try { raw = localStorage.getItem(LS_KEY); } catch (err) { return null; }
    if (!raw) return null;
    try {
      var c = JSON.parse(raw);
      return (c && typeof c === 'object') ? c : null;
    } catch (err) { return null; }
  }

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function applyConfig() {
    var c = loadConfig();
    if (!c) return false;
    if (isFinite(c.L1)) P.L1 = clamp(c.L1, 60, 180);
    if (isFinite(c.L2)) P.L2 = clamp(c.L2, 60, 180);
    if (isFinite(c.g))  P.g  = clamp(c.g, 0, 25);
    activePreset = PRESETS[c.preset] ? c.preset : matchPreset(P.g);
    syncSlider('sL1', 'vL1', P.L1, f0);
    syncSlider('sL2', 'vL2', P.L2, f0);
    syncSlider('sG',  'vG',  Math.round(P.g * 10) / 10, f1);
    markCap(activePreset);
    return true;
  }

  // ---------- 绘制底板 ----------
  function roundRect(x, yy, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, yy);
    ctx.lineTo(x + w - r, yy); ctx.quadraticCurveTo(x + w, yy, x + w, yy + r);
    ctx.lineTo(x + w, yy + h - r); ctx.quadraticCurveTo(x + w, yy + h, x + w - r, yy + h);
    ctx.lineTo(x + r, yy + h); ctx.quadraticCurveTo(x, yy + h, x, yy + h - r);
    ctx.lineTo(x, yy + r); ctx.quadraticCurveTo(x, yy, x + r, yy);
    ctx.closePath();
  }

  function drawGrid() {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.035)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var x = 0; x < W; x += 44) { ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); }
    for (var yy = 0; yy < H; yy += 44) { ctx.moveTo(0, yy + .5); ctx.lineTo(W, yy + .5); }
    ctx.stroke();
    ctx.restore();
  }

  function drawVignette() {
    var g = ctx.createRadialGradient(cx, cy + 140, 40, cx, cy + 140, Math.max(W, H) * 0.75);
    g.addColorStop(0, 'rgba(80,110,160,0.14)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawTrail2(hueOffset) {
    var n = trail2.length;
    if (n < 3) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for (var i = 1; i < n; i++) {
      var t = i / n;
      var hue = (t * 320 + hueOffset) % 360;
      ctx.strokeStyle = 'hsla(' + hue.toFixed(0) + ',100%,60%,' + (t * t * 0.62).toFixed(3) + ')';
      ctx.lineWidth = 1 + t * 4.5;
      ctx.beginPath();
      ctx.moveTo(trail2[i - 1].x, trail2[i - 1].y);
      ctx.lineTo(trail2[i].x, trail2[i].y);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawTrail1() {
    var n = trail1.length;
    if (n < 3) return;
    ctx.save();
    ctx.lineCap = 'round';
    for (var i = 1; i < n; i++) {
      var t = i / n;
      ctx.strokeStyle = 'rgba(0,229,255,' + (t * t * 0.34).toFixed(3) + ')';
      ctx.lineWidth = 1 + t * 2;
      ctx.beginPath();
      ctx.moveTo(trail1[i - 1].x, trail1[i - 1].y);
      ctx.lineTo(trail1[i].x, trail1[i].y);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawHUD() {
    var deg = function (v) { return (v / DEG).toFixed(1); };
    var E = energy();
    var scene = PRESETS[activePreset] ? PRESETS[activePreset].name : '自定义';
    var lines = [
      'θ₁ = ' + deg(y[0]) + '°   ω₁ = ' + y[1].toFixed(2) + ' rad/s',
      'θ₂ = ' + deg(y[2]) + '°   ω₂ = ' + y[3].toFixed(2) + ' rad/s',
      'E = ' + E.toFixed(4) + ' J    |ΔE| = ' + Math.abs(E - E0).toExponential(1) + ' J',
      'RK4 h = ' + H_STEP.toFixed(5) + ' s    场景 ' + scene + '    t = ' + simTime.toFixed(1) + ' s'
    ];
    ctx.save();
    ctx.font = '12px Consolas, "SF Mono", Menlo, monospace';
    var w = 0, i;
    for (i = 0; i < lines.length; i++) w = Math.max(w, ctx.measureText(lines[i]).width);
    var pad = 10, lh = 18, bw = w + pad * 2, bh = lines.length * lh + pad * 2 - 4;
    ctx.fillStyle = 'rgba(12,14,22,0.55)';
    ctx.strokeStyle = 'rgba(0,229,255,0.14)';
    roundRect(14, 14, bw, bh, 8); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#9fb3c8';
    for (i = 0; i < lines.length; i++) ctx.fillText(lines[i], 14 + pad, 14 + pad + 12 + i * lh);
    ctx.restore();
  }

  function drawRod(x0, y0, x1, y1, c0, c1, w) {
    var g = ctx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, c0); g.addColorStop(1, c1);
    ctx.save();
    ctx.strokeStyle = g;
    ctx.lineWidth = w;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    ctx.restore();
  }

  function drawBob(px, py, r, c1, c2, haloColor) {
    var halo = ctx.createRadialGradient(px, py, r * 0.5, px, py, r * 3.6);
    halo.addColorStop(0, haloColor); halo.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(px, py, r * 3.6, 0, Math.PI * 2); ctx.fill();

    ctx.save();
    ctx.shadowColor = c2;
    ctx.shadowBlur = 26;
    var g = ctx.createRadialGradient(px - r * 0.3, py - r * 0.35, 2, px, py, r);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.35, c1);
    g.addColorStop(1, c2);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function draw() {
    ctx.fillStyle = '#1a1a24';
    ctx.fillRect(0, 0, W, H);
    drawGrid();
    drawVignette();

    var p1 = pos1(), p2 = pos2();

    ctx.save();
    ctx.setLineDash([5, 6]);
    ctx.strokeStyle = 'rgba(160,180,200,0.2)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, cy + P.L1 + P.L2 + 40); ctx.stroke();
    ctx.restore();

    drawTrail1();
    drawTrail2((simTime * 90) % 360);

    drawRod(cx, cy, p1.x, p1.y, 'rgba(150,170,190,0.85)', 'rgba(0,229,255,0.95)', 3);
    drawRod(p1.x, p1.y, p2.x, p2.y, 'rgba(255,160,90,0.9)', 'rgba(255,90,150,0.95)', 2.5);

    drawBob(p1.x, p1.y, R1, '#7df9ff', '#0a6b8a', 'rgba(0,229,255,0.18)');
    drawBob(p2.x, p2.y, R2, '#ffe9a8', '#ff6b2c', 'rgba(255,140,60,0.2)');

    ctx.save();
    ctx.fillStyle = '#2b2f3d';
    ctx.strokeStyle = 'rgba(0,229,255,0.8)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.restore();

    drawHUD();
  }

  // ---------- 主循环：requestAnimationFrame 驱动 RK4 + 渲染 ----------
  var last = 0, acc = 0;

  function frame(now) {
    if (!last) last = now;
    var dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;

    updateGAnim(now);                     // 场景切换的重力过渡（与帧率解耦）

    if (P.running && !dragging) {
      acc += dt;
      var guard = 0;
      while (acc >= H_STEP && guard++ < 300) { rk4(H_STEP); acc -= H_STEP; simTime += H_STEP; }
    } else {
      acc = 0;
    }

    if (!isFinite(y[0]) || !isFinite(y[2])) { reset(); }

    if (P.showTrail && P.running) {
      var a = pos1(), b = pos2();
      trail1.push(a); if (trail1.length > MAX1) trail1.shift();
      trail2.push(b); if (trail2.length > MAX2) trail2.shift();
    }

    draw();
    requestAnimationFrame(frame);
  }

  // ---------- 交互：鼠标 / 触屏拖拽任一摆球 ----------
  var dragging = 0;
  var COARSE = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  var HIT_PAD = COARSE ? 26 : 14;         // 手指比鼠标粗，命中区放大

  function toCanvas(e) {
    var r = cv.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function clampAngle(a) {
    var lim = 175 * DEG;
    return Math.max(-lim, Math.min(lim, a));
  }
  function endDrag(e) {
    dragging = 0;
    cv.classList.remove('dragging');
    if (e && e.pointerId !== undefined) {
      try { cv.releasePointerCapture(e.pointerId); } catch (err) {}
    }
    E0 = energy();
  }

  cv.addEventListener('pointerdown', function (e) {
    var p = toCanvas(e);
    var b = pos2(), a = pos1();
    if (Math.hypot(p.x - b.x, p.y - b.y) < R2 + HIT_PAD) dragging = 2;
    else if (Math.hypot(p.x - a.x, p.y - a.y) < R1 + HIT_PAD) dragging = 1;
    else return;
    cv.classList.add('dragging');
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  });

  cv.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var p = toCanvas(e);
    if (dragging === 1) {
      y[0] = clampAngle(Math.atan2(p.x - cx, p.y - cy));
      y[1] = 0;
    } else {
      var a = pos1();
      y[2] = clampAngle(Math.atan2(p.x - a.x, p.y - a.y));
      y[3] = 0;
    }
    trail1.length = 0; trail2.length = 0;
    E0 = energy();
  });

  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);
  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // ---------- 控件绑定 ----------
  function bind(id, valId, key, fmt) {
    var s = document.getElementById(id), v = document.getElementById(valId);
    s.addEventListener('input', function () {
      P[key] = parseFloat(s.value);
      v.textContent = fmt(P[key]);
      if (key === 'L1' || key === 'L2') { trail1.length = 0; trail2.length = 0; }
      if (key === 'g') {
        gAnim = null;                     // 手动拖滑块 → 打断场景过渡动画
        activePreset = matchPreset(P.g);  // 落在预设值上则自动点亮对应胶囊
        markCap(activePreset);
        E0 = energy();
      }
      if (key === 'L1') resize(true);
      saveConfig();
    });
  }
  bind('sL1', 'vL1', 'L1', f0);
  bind('sL2', 'vL2', 'L2', f0);
  bind('sG',  'vG',  'g',  f1);

  // 天体胶囊：点击 → 重力平滑过渡 + 滑块同步 + 持久化
  (function () {
    var capsEl = document.getElementById('caps');
    capsEl.addEventListener('click', function (e) {
      var node = e.target;
      while (node && node !== capsEl && !/cap/.test(node.className || '')) node = node.parentNode;
      if (!node || node === capsEl) return;
      var k = node.getAttribute('data-k');
      var preset = PRESETS[k];
      if (!preset) return;
      activePreset = k;
      markCap(k);
      animateG(preset.g);
      saveConfig();
    });
  })();

  var btnRun = document.getElementById('btnRun');
  btnRun.addEventListener('click', function () {
    P.running = !P.running;
    btnRun.textContent = P.running ? '暂停' : '继续';
    btnRun.classList.toggle('primary', P.running);
  });
  document.getElementById('btnReset').addEventListener('click', reset);
  document.getElementById('btnKick').addEventListener('click', function () {
    y[1] += (Math.random() - 0.5) * 0.08;
    E0 = energy();
  });
  document.getElementById('btnClear').addEventListener('click', function () {
    trail1.length = 0; trail2.length = 0;
  });
  document.getElementById('chkTrail').addEventListener('change', function (e) {
    P.showTrail = e.target.checked;
    trail1.length = 0; trail2.length = 0;
  });

  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space') { e.preventDefault(); btnRun.click(); }
    if (e.key === 'r' || e.key === 'R') reset();
    if (e.key === 'p' || e.key === 'P') document.getElementById('btnKick').click();
  });

  // ---------- 启动：先恢复本地配置，再布局与运行 ----------
  applyConfig();
  resize(true);
  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
